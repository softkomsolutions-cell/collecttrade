services:
  - type: web
    name: collecttrade-staging
    runtime: docker
    plan: starter
    region: frankfurt
    dockerContext: .
    dockerfilePath: ./Dockerfile
    healthCheckPath: /api/health
    envVars:
      - key: PORT
        value: "5000"
      - key: NODE_ENV
        value: production
      - key: AUTH_SECRET
        generateValue: true
      - key: CONNECTOR_SECRET
        generateValue: true
      - key: TWELVE_DATA_API_KEY
        sync: false
      - key: TWELVE_DATA_INTERVAL
        value: 1h
      - key: TWELVE_DATA_JSE_SYMBOL
        value: JTOPI
    disk:
      name: collecttrade-data
      mountPath: /app/server/data
      sizeGB: 1
