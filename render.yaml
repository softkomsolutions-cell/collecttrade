services:
  - type: web
    name: collecttrade-staging
    runtime: docker
    plan: free
    region: oregon
    dockerContext: .
    dockerfilePath: ./Dockerfile
    healthCheckPath: /api/health
    envVars:
      - key: PORT
        value: "5000"
      - key: NODE_ENV
        value: production
      - key: AUTH_SECRET
        generateValue: true
      - key: CONNECTOR_SECRET
        generateValue: true
      - key: TWELVE_DATA_API_KEY
        sync: false
      - key: TWELVE_DATA_INTERVAL
        value: 1h
      - key: TWELVE_DATA_JSE_SYMBOL
        value: JTOPI
      - key: BRICKECONOMY_API_KEY
        sync: false
      - key: BRICKLINK_CONSUMER_KEY
        sync: false
      - key: BRICKLINK_CONSUMER_SECRET
        sync: false
      - key: BRICKLINK_TOKEN
        sync: false
      - key: BRICKLINK_TOKEN_SECRET
        sync: false
      - key: USD_ZAR_RATE
        value: "17.8"
